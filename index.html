<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Home Hub</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg: #F3ECDC;
    --card: #FFFFFF;
    --card-dim: #FBF2E1;
    --ink: #3B2A22;
    --ink-soft: #8A7360;
    --paper: #FCF8EF;
    --teal: #3F8481;
    --teal-dark: #2C625F;
    --mustard: #E0A63C;
    --mustard-dark: #B9832A;
    --rust: #C1592B;
    --sage: #7C8B4A;
    --line: rgba(59,42,34,0.13);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background-image:
      radial-gradient(circle at 15% 10%, rgba(193,89,43,0.05) 0%, transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(63,132,129,0.05) 0%, transparent 40%);
  }

  .hub {
    height: 100vh;
    width: 100vw;
    padding: 22px 26px;
    display: grid;
    grid-template-rows: auto auto 1fr;
    gap: 16px;
  }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 0 4px;
  }
  .clock .time {
    font-family: 'Fredoka', sans-serif;
    font-size: 54px;
    font-weight: 600;
    line-height: 1;
  }
  .clock .date {
    font-family: 'Fredoka', sans-serif;
    font-size: 22px;
    font-weight: 500;
    color: var(--ink-soft);
    margin-top: 4px;
  }
  .status {
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 24px;
    padding: 8px 16px;
    background: transparent;
    color: var(--ink-soft);
    font-family: 'Inter', sans-serif;
  }
  .status .dot {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    background: var(--sage); margin-right: 7px; vertical-align: 1px;
  }
  .status.off {
    background: var(--rust);
    color: var(--paper);
    font-size: 17px;
    padding: 12px 22px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(193,89,43,0.30);
  }
  .status.off .dot { display: none; }

  /* CARDS */
  .card {
    background: var(--card);
    border-radius: 18px;
    padding: 18px 22px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    box-shadow: 0 6px 16px rgba(59,42,34,0.10);
    border-top: 5px solid transparent;
  }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    flex-shrink: 0;
  }
  .card-head h2 {
    font-family: 'Fredoka', sans-serif;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .tag {
    font-size: 12px;
    background: var(--teal);
    color: var(--paper);
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 600;
  }
  .card-body { overflow: auto; flex: 1; min-height: 0; }
  .card-body::-webkit-scrollbar { width: 5px; }
  .card-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  .empty-hint { font-size: 15px; color: var(--ink-soft); padding: 6px 0; font-style: italic; }

  /* TODAY */
  .today-card {
    border-top-color: var(--mustard);
    flex-direction: row;
    gap: 24px;
    max-height: 38vh;
  }
  .today-events { flex: 2; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .today-event {
    display: flex; gap: 16px; align-items: baseline;
    padding: 9px 0; border-bottom: 1px solid var(--line);
    font-size: 21px;
  }
  .today-event:last-child { border-bottom: none; }
  .today-event .t {
    font-weight: 700; color: var(--teal-dark);
    width: 96px; flex-shrink: 0; font-size: 17px;
  }
  .today-event .n { font-weight: 500; }
  .today-event.past { opacity: 0.4; }
  .today-event.next .n { font-weight: 700; }
  .today-event.next .t::after {
    content: "NEXT"; display: block; font-size: 10px; letter-spacing: 0.8px;
    color: var(--mustard-dark); margin-top: 2px;
  }

  .focus {
    flex: 1.15;
    min-width: 0;
    background: linear-gradient(160deg, var(--card) 0%, var(--card-dim) 100%);
    border: 2px solid var(--mustard);
    border-radius: 14px;
    padding: 14px 18px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .focus h2 {
    font-family: 'Fredoka', sans-serif; font-size: 15px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.4px; color: var(--mustard-dark);
    margin-bottom: 6px; flex-shrink: 0;
  }
  .focus-body { overflow: auto; min-height: 0; }
  .focus-group { margin-bottom: 8px; }
  .focus-group:last-child { margin-bottom: 0; }
  .focus-group h3 {
    font-family: 'Fredoka', sans-serif; font-size: 12.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px; color: var(--teal-dark); margin-bottom: 2px;
  }
  .focus-item { font-size: 16px; line-height: 1.3; padding: 3px 0; display: flex; gap: 8px; align-items: baseline; }
  .focus-item .badge {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase;
    color: var(--rust); flex-shrink: 0;
  }
  .focus-item .due { font-size: 12px; color: var(--ink-soft); flex-shrink: 0; margin-left: auto; }
  .focus-item .due.late { color: var(--rust); font-weight: 600; }

  /* WEATHER (header) */
  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .weather { display: flex; align-items: center; gap: 12px; text-align: right; }
  .weather[hidden] { display: none; }
  .weather .icon { font-size: 38px; line-height: 1; }
  .weather .temp { font-family: 'Fredoka', sans-serif; font-size: 34px; font-weight: 600; line-height: 1; }
  .weather .meta { font-size: 14px; color: var(--ink-soft); margin-top: 3px; }
  .weather .tip { font-size: 14px; font-weight: 700; color: var(--rust); }

  /* LOWER ROW */
  .lower {
    display: grid;
    grid-template-columns: 1.7fr 1fr;
    gap: 16px;
    min-height: 0;
  }
  .week-card { border-top-color: var(--teal); }
  .lists-card { border-top-color: var(--rust); }

  .week-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .week-table th {
    font-family: 'Fredoka', sans-serif; font-size: 14px; text-transform: uppercase;
    letter-spacing: 0.4px; color: var(--ink-soft); text-align: left;
    padding: 4px 6px 6px; border-bottom: 1px solid var(--line);
  }
  .week-table td { vertical-align: top; padding: 6px 4px; }
  .week-table .today-col { background: rgba(224,166,60,0.13); color: var(--mustard-dark); }
  .week-table td.today-col { color: var(--ink); border-radius: 0 0 8px 8px; }
  .week-table th.today-col { border-radius: 8px 8px 0 0; }
  .wk-ev {
    background: rgba(63,132,129,0.12); border-radius: 6px;
    padding: 4px 6px; margin-bottom: 4px; line-height: 1.25;
  }
  .wk-ev .t { display: block; font-weight: 700; color: var(--teal-dark); font-size: 11.5px; }
  .wk-ev .n { display: block; font-size: 13px; }
  .wk-empty { color: var(--ink-soft); font-size: 12px; opacity: 0.6; }

  /* Week / Day toggle */
  .seg { display: flex; background: var(--card-dim); border-radius: 20px; padding: 3px; }
  .seg button {
    border: none; background: transparent; cursor: pointer;
    font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600;
    color: var(--ink-soft); padding: 6px 16px; border-radius: 17px;
  }
  .seg button.on { background: var(--teal); color: var(--paper); }

  /* Day timeline */
  .allday { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .allday span {
    background: rgba(224,166,60,0.18); color: var(--ink);
    font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 8px;
  }
  .timeline { position: relative; margin-left: 58px; }
  .hour-row { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
  .hour-row span {
    position: absolute; left: -58px; top: -8px; width: 50px; text-align: right;
    font-size: 12px; font-weight: 600; color: var(--ink-soft);
  }
  .block {
    position: absolute; border-radius: 8px; padding: 4px 8px; overflow: hidden;
    background: rgba(63,132,129,0.16); border-left: 4px solid var(--teal);
    font-size: 14px; line-height: 1.25;
  }
  .block .t { font-size: 11.5px; font-weight: 700; color: var(--teal-dark); }
  .block.past { opacity: 0.45; }
  .now-line { position: absolute; left: -6px; right: 0; height: 2px; background: var(--rust); z-index: 2; }
  .now-line::before {
    content: ""; position: absolute; left: -4px; top: -4px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--rust);
  }

  ul.plain { list-style: none; }
  ul.plain li {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 0; font-size: 17px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: opacity .25s;
  }
  ul.plain li:last-child { border-bottom: none; }
  ul.plain li.leaving { opacity: 0; }
  .check {
    width: 22px; height: 22px; border-radius: 6px;
    border: 2px solid var(--teal); flex-shrink: 0;
  }
  li.leaving .check { background: var(--sage); border-color: var(--sage); }

  .sub { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
  .add-row { display: flex; gap: 8px; margin-top: 8px; flex-shrink: 0; }
  .add-row input {
    flex: 1; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    font-size: 16px; font-family: 'Inter', sans-serif;
  }
  .add-row input:focus { outline: 2px solid var(--teal); }
  .add-btn {
    width: 42px; flex-shrink: 0; border: none; border-radius: 10px;
    background: var(--teal); color: var(--paper);
    font-size: 20px; font-weight: 600; cursor: pointer;
  }

  /* MODALS */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--card); color: var(--ink);
    border-radius: 16px; padding: 24px 26px;
    width: 460px; max-width: 92vw; max-height: 86vh;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }
  .modal-box h3 { font-family: 'Fredoka', sans-serif; font-size: 22px; margin-bottom: 12px; }
  .modal-box label {
    display: block; font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.4px; color: var(--ink-soft); margin: 12px 0 5px;
  }
  .modal-box input {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    font-size: 16px; font-family: 'Inter', sans-serif;
  }
  .modal-scroll { overflow: auto; min-height: 0; font-size: 16px; line-height: 1.5; white-space: pre-wrap; }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; flex-shrink: 0; }
  .modal-btn {
    flex: 1; padding: 12px; border-radius: 10px; border: none;
    font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .modal-btn.cancel { background: var(--card-dim); color: var(--ink-soft); }
  .modal-btn.confirm { background: var(--teal); color: var(--paper); }

  /* Portrait iPad */
  @media (orientation: portrait) {
    .hub { grid-template-rows: auto auto 1fr; }
    .today-card { flex-direction: column; max-height: none; }
    .focus { max-height: 30vh; }
    .lower { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1.2fr) minmax(0, 1fr); }
  }
</style>
</head>
<body>

<div class="hub">
  <div class="header">
    <div class="clock">
      <div class="time" id="time">--:--</div>
      <div class="date" id="date">Loading…</div>
    </div>
    <div class="header-right">
      <div class="weather" id="weather" hidden>
        <div>
          <div class="temp" id="wx-temp"></div>
          <div class="meta" id="wx-meta"></div>
          <div class="tip" id="wx-tip"></div>
        </div>
        <div class="icon" id="wx-icon"></div>
      </div>
      <button class="status off" id="status" onclick="reconnect()"><span class="dot"></span><span id="status-text">Tap to connect Google</span></button>
    </div>
  </div>

  <!-- TODAY -->
  <div class="card today-card">
    <div class="today-events">
      <div class="card-head"><h2>Today</h2><button class="tag" style="border:none;cursor:pointer;" id="add-event-btn" onclick="openEventModal()" hidden>+ Event</button></div>
      <div class="card-body" id="today-body"><div class="empty-hint">Connect Google to see today's plan.</div></div>
    </div>
    <div class="focus" id="focus">
      <h2>This week's focus</h2>
      <div class="focus-body" id="focus-body"><div class="empty-hint">Loading from Asana…</div></div>
    </div>
  </div>

  <div class="lower">
    <!-- WEEK -->
    <div class="card week-card">
      <div class="card-head">
        <h2 id="cal-view-title">This week</h2>
        <div class="seg" role="group" aria-label="Calendar view">
          <button id="view-week" onclick="setCalView('week')">Week</button>
          <button id="view-day" onclick="setCalView('day')">Day</button>
        </div>
      </div>
      <div class="card-body" id="week-body"></div>
    </div>

    <!-- TASKS + REMINDERS -->
    <div class="card lists-card">
      <div class="card-body">
        <div class="card-head"><h2>Tasks</h2><span class="tag" id="tasks-count">0</span></div>
        <div id="tasks-body"></div>
        <div class="add-row">
          <input type="text" id="tasks-add-input" placeholder="Add a task…" onkeydown="if(event.key==='Enter') addListItem('tasks')">
          <button class="add-btn" onclick="addListItem('tasks')">+</button>
        </div>
        <div class="sub">
          <div class="card-head"><h2>Reminders</h2><span class="tag" id="reminders-count">0</span></div>
          <div id="reminders-body"></div>
          <div class="add-row">
            <input type="text" id="reminders-add-input" placeholder="Add a reminder…" onkeydown="if(event.key==='Enter') addListItem('reminders')">
            <button class="add-btn" onclick="addListItem('reminders')">+</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ADD EVENT MODAL -->
<div class="modal-overlay" id="event-modal">
  <div class="modal-box">
    <h3>Add event</h3>
    <label for="event-title">Title</label>
    <input type="text" id="event-title" placeholder="e.g. Dentist appointment">
    <label for="event-date">Date</label>
    <input type="date" id="event-date">
    <label for="event-time">Time</label>
    <input type="time" id="event-time">
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeModal('event-modal')">Cancel</button>
      <button class="modal-btn confirm" onclick="submitCalendarEvent()">Add</button>
    </div>
  </div>
</div>

<script>
  // ---------- helpers ----------
  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function store(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
  function recall(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function localDateKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }
  function fmtTime(d, short) {
    let h = d.getHours(); const m = String(d.getMinutes()).padStart(2, "0");
    const ap = h >= 12 ? (short ? "p" : " PM") : (short ? "a" : " AM");
    h = h % 12 || 12;
    return `${h}:${m}${ap}`;
  }
  window.closeModal = id => document.getElementById(id).classList.remove("open");

  // ---------- clock ----------
  function updateClock() {
    const now = new Date();
    document.getElementById("time").textContent = fmtTime(now);
    document.getElementById("date").textContent = now.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  }
  updateClock();
  setInterval(updateClock, 15000);

  // Reload once a day around 4 AM so the day rolls over and any update pushed to GitHub shows up.
  (function scheduleDailyReload() {
    const now = new Date();
    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 4, 0, 0);
    if (next <= now) next.setDate(next.getDate() + 1);
    setTimeout(() => location.reload(), next - now);
  })();

  // ---------- weekly focus (Asana, through the Apps Script bridge) ----------
  // The bridge URL is kept only on this iPad, never in the public repo.
  // One-time setup: open marendas.github.io/?asana=<your bridge /exec URL> on the iPad.
  const BRIDGE_KEY = "hub-asana-bridge";
  (function captureBridgeUrl() {
    const params = new URLSearchParams(location.search);
    const url = params.get("asana");
    if (url && /^https:\/\/script\.google\.com\//.test(url)) {
      store(BRIDGE_KEY, url);
      history.replaceState(null, "", location.pathname);
    }
  })();

  async function loadFocus() {
    const body = document.getElementById("focus-body");
    const url = recall(BRIDGE_KEY);
    if (!url) { body.innerHTML = `<div class="empty-hint">Asana isn't connected yet.</div>`; return; }
    try {
      const res = await fetch(url);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      renderFocus(data.items || []);
    } catch (e) {
      console.warn("Could not load Asana focus:", e);
      if (!body.querySelector(".focus-group")) body.innerHTML = `<div class="empty-hint">Couldn't reach Asana. Will try again shortly.</div>`;
    }
  }

  function renderFocus(items) {
    const body = document.getElementById("focus-body");
    if (items.length === 0) { body.innerHTML = `<div class="empty-hint">Nothing in This Week or In Progress.</div>`; return; }
    const todayKey = localDateKey(new Date());
    const groups = {};
    items.forEach(i => (groups[i.project] = groups[i.project] || []).push(i));
    body.innerHTML = Object.entries(groups).map(([project, list]) => `
      <div class="focus-group">
        <h3>${esc(project)}</h3>
        ${list.map(i => {
          let due = "";
          if (i.due_on) {
            const d = new Date(i.due_on + "T12:00:00");
            due = `<span class="due ${i.due_on < todayKey ? "late" : ""}">${d.toLocaleDateString("en-US", { weekday: "short" })} ${d.getMonth() + 1}/${d.getDate()}</span>`;
          }
          const badge = /progress/i.test(i.section) ? `<span class="badge">Doing</span>` : "";
          return `<div class="focus-item">${badge}<span>${esc(i.name)}</span>${due}</div>`;
        }).join("")}
      </div>`).join("");
  }

  window.addEventListener("load", loadFocus);
  setInterval(loadFocus, 10 * 60 * 1000);

  // ---------- weather (Open-Meteo: free, no key, no sign-in) ----------
  // Atlanta by default. To use your exact spot, change these two numbers.
  const WX_LAT = 33.749, WX_LON = -84.388;
  const WX_CODES = [
    [[0], "☀️", "Clear"], [[1, 2], "🌤️", "Partly cloudy"], [[3], "☁️", "Cloudy"], [[45, 48], "🌫️", "Fog"],
    [[51, 53, 55, 56, 57], "🌦️", "Drizzle"], [[61, 63, 65, 66, 67, 80, 81, 82], "🌧️", "Rain"],
    [[71, 73, 75, 77, 85, 86], "🌨️", "Snow"], [[95, 96, 99], "⛈️", "Storms"],
  ];
  function wxLookup(code) { return WX_CODES.find(([codes]) => codes.includes(code)) || [null, "🌡️", ""]; }

  async function loadWeather() {
    const params = new URLSearchParams({
      latitude: WX_LAT, longitude: WX_LON,
      current: "temperature_2m,weather_code",
      daily: "temperature_2m_max,temperature_2m_min,precipitation_probability_max",
      temperature_unit: "fahrenheit", timezone: "America/New_York", forecast_days: "1",
    });
    try {
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
      const w = await res.json();
      const [, icon, label] = wxLookup(w.current.weather_code);
      const hi = Math.round(w.daily.temperature_2m_max[0]), lo = Math.round(w.daily.temperature_2m_min[0]);
      const rain = w.daily.precipitation_probability_max[0] ?? 0;
      let tip = "";
      if (rain >= 40) tip = "Bring an umbrella";
      else if (hi <= 45) tip = "Bundle up";
      else if (hi <= 60 || lo <= 45) tip = "Jacket weather";
      document.getElementById("wx-icon").textContent = icon;
      document.getElementById("wx-temp").textContent = `${Math.round(w.current.temperature_2m)}°`;
      document.getElementById("wx-meta").textContent = `${label} · H ${hi}° L ${lo}° · Rain ${rain}%`;
      document.getElementById("wx-tip").textContent = tip;
      document.getElementById("weather").hidden = false;
    } catch (e) { console.warn("Could not load weather:", e); }
  }
  window.addEventListener("load", loadWeather);
  setInterval(loadWeather, 30 * 60 * 1000);

  // ---------- Google sign-in (Calendar + Tasks) ----------
  const GOOGLE_CLIENT_ID = "773299217986-g2n2oq49v99currf80ag0ks7bmbt41rq.apps.googleusercontent.com";
  const GOOGLE_SCOPES = "https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/tasks";
  const TOKEN_KEY = "hub-google-token";
  let accessToken = null, tokenExpiry = 0, tokenClient = null, refreshTimer = null, lastSync = null;

  function connected() { return !!accessToken && Date.now() < tokenExpiry; }

  function saveToken(token, expiresInSec) {
    accessToken = token;
    tokenExpiry = Date.now() + (Number(expiresInSec) || 3600) * 1000 - 60 * 1000;
    store(TOKEN_KEY, JSON.stringify({ token, exp: tokenExpiry }));
    store("hub-google-consented", "1");
  }
  function restoreToken() {
    try {
      const saved = JSON.parse(recall(TOKEN_KEY) || "null");
      if (saved && saved.token && saved.exp > Date.now()) { accessToken = saved.token; tokenExpiry = saved.exp; }
    } catch (e) {}
  }

  function setStatus() {
    const btn = document.getElementById("status");
    const txt = document.getElementById("status-text");
    if (connected()) {
      btn.classList.remove("off");
      txt.textContent = lastSync ? `Synced ${fmtTime(lastSync)}` : "Syncing…";
      document.getElementById("add-event-btn").hidden = false;
    } else {
      btn.classList.add("off");
      txt.textContent = lastSync ? `Tap to refresh · last synced ${fmtTime(lastSync)}` : "Tap to connect Google";
      document.getElementById("add-event-btn").hidden = true;
    }
  }

  function scheduleSilentRefresh() {
    clearTimeout(refreshTimer);
    const wait = Math.max(0, tokenExpiry - Date.now() - 4 * 60 * 1000);
    refreshTimer = setTimeout(() => {
      // May be blocked by Safari without a tap; if so, the status button turns into "Tap to refresh".
      if (tokenClient) tokenClient.requestAccessToken({ prompt: "" });
    }, wait);
  }

  async function gfetch(url, opts = {}) {
    if (!connected()) { setStatus(); throw new Error("not connected"); }
    const res = await fetch(url, { ...opts, headers: { Authorization: `Bearer ${accessToken}`, ...(opts.headers || {}) } });
    if (res.status === 401) { accessToken = null; setStatus(); throw new Error("token expired"); }
    return res;
  }

  function initGoogleAuth() {
    if (!(window.google && google.accounts && google.accounts.oauth2)) { setTimeout(initGoogleAuth, 500); return; }
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: GOOGLE_SCOPES,
      callback: resp => {
        if (resp.error) { console.warn("Google auth error:", resp.error); setStatus(); return; }
        saveToken(resp.access_token, resp.expires_in);
        scheduleSilentRefresh();
        refreshAll();
      },
      error_callback: err => { console.warn("Google auth popup issue:", err); setStatus(); },
    });
  }

  window.reconnect = function () {
    if (connected()) { refreshAll(); return; }
    if (!tokenClient) return;
    tokenClient.requestAccessToken({ prompt: recall("hub-google-consented") ? "" : "consent" });
  };

  async function refreshAll() {
    setStatus();
    if (!connected()) return;
    try {
      await Promise.all([loadCalendar(), renderLists()]);
      lastSync = new Date();
    } catch (e) { console.warn("Refresh issue:", e); }
    setStatus();
  }
  setInterval(() => { connected() ? refreshAll() : setStatus(); }, 10 * 60 * 1000);

  // ---------- calendar ----------
  function weekDates() {
    const now = new Date();
    const dow = now.getDay();
    const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + ((dow === 0 ? -6 : 1) - dow));
    return Array.from({ length: 7 }, (_, i) => new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i));
  }
  function evStart(ev) { return ev.start.dateTime ? new Date(ev.start.dateTime) : new Date(ev.start.date + "T00:00:00"); }
  function evEnd(ev) { return ev.end && ev.end.dateTime ? new Date(ev.end.dateTime) : null; }

  async function loadCalendar() {
    const days = weekDates();
    const end = new Date(days[6]); end.setDate(end.getDate() + 1);
    const params = new URLSearchParams({
      timeMin: days[0].toISOString(), timeMax: end.toISOString(),
      singleEvents: "true", orderBy: "startTime", maxResults: "100",
    });
    const res = await gfetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?${params}`);
    const data = await res.json();
    const events = (data.items || []).filter(ev => ev.status !== "cancelled");
    lastEvents = events;
    renderToday(events);
    renderCalView();
  }

  // Week / Day toggle — choice is remembered on the iPad.
  let lastEvents = null;
  let calView = recall("hub-cal-view") === "day" ? "day" : "week";

  window.setCalView = function (v) {
    calView = v;
    store("hub-cal-view", v);
    renderCalView();
  };

  function renderCalView() {
    document.getElementById("view-week").classList.toggle("on", calView === "week");
    document.getElementById("view-day").classList.toggle("on", calView === "day");
    document.getElementById("cal-view-title").textContent = calView === "week" ? "This week" : "Today's time blocks";
    if (!lastEvents) return;
    if (calView === "week") renderWeek(lastEvents, weekDates());
    else renderDay(lastEvents);
  }

  function renderDay(events) {
    const now = new Date();
    const key = localDateKey(now);
    const todays = events.filter(ev => localDateKey(evStart(ev)) === key);
    const allDay = todays.filter(ev => !ev.start.dateTime);
    const timed = todays.filter(ev => ev.start.dateTime).map(ev => {
      const s = evStart(ev);
      const e = evEnd(ev) || new Date(s.getTime() + 30 * 60000);
      return { ev, s, e, sh: s.getHours() + s.getMinutes() / 60, eh: Math.max(e.getHours() + e.getMinutes() / 60 + (localDateKey(e) !== key ? 24 : 0), s.getHours() + s.getMinutes() / 60 + 0.25) };
    });

    // Show 7 AM – 10 PM, stretched to fit any earlier or later blocks.
    let startH = 7, endH = 22;
    timed.forEach(b => { startH = Math.min(startH, Math.floor(b.sh)); endH = Math.max(endH, Math.ceil(Math.min(b.eh, 24))); });
    const HOUR = 52;

    // Side-by-side lanes for overlapping blocks.
    timed.sort((a, b) => a.sh - b.sh || b.eh - a.eh);
    let cluster = [], clusterEnd = -1;
    const flush = () => { const lanes = Math.max(...cluster.map(b => b.lane)) + 1; cluster.forEach(b => b.lanes = lanes); cluster = []; };
    timed.forEach(b => {
      if (cluster.length && b.sh >= clusterEnd) flush();
      const used = cluster.filter(c => c.eh > b.sh).map(c => c.lane);
      let lane = 0; while (used.includes(lane)) lane++;
      b.lane = lane; cluster.push(b); clusterEnd = Math.max(clusterEnd, b.eh);
    });
    if (cluster.length) flush();

    let html = allDay.length ? `<div class="allday">${allDay.map(ev => `<span>${esc(ev.summary || "(untitled)")}</span>`).join("")}</div>` : "";
    html += `<div class="timeline" style="height:${(endH - startH) * HOUR + 10}px">`;
    for (let h = startH; h <= endH; h++) {
      const label = `${h % 12 || 12} ${h % 24 >= 12 ? "PM" : "AM"}`;
      html += `<div class="hour-row" style="top:${(h - startH) * HOUR}px"><span>${label}</span></div>`;
    }
    timed.forEach(b => {
      const top = (b.sh - startH) * HOUR, height = Math.max((Math.min(b.eh, endH) - b.sh) * HOUR - 3, 22);
      const w = 100 / b.lanes;
      html += `<div class="block ${b.e < now ? "past" : ""}" style="top:${top}px;height:${height}px;left:calc(${w * b.lane}% + 2px);width:calc(${w}% - 6px)">
        <div class="t">${fmtTime(b.s, true)} – ${fmtTime(b.e, true)}</div><div>${esc(b.ev.summary || "(untitled)")}</div></div>`;
    });
    const nowH = now.getHours() + now.getMinutes() / 60;
    if (nowH >= startH && nowH <= endH) html += `<div class="now-line" style="top:${(nowH - startH) * HOUR}px"></div>`;
    html += `</div>`;

    const body = document.getElementById("week-body");
    body.innerHTML = html;
    if (!timed.length && !allDay.length) body.insertAdjacentHTML("afterbegin", `<div class="empty-hint" style="margin-bottom:8px">No time blocks today.</div>`);
    // Keep the current hour in view.
    body.scrollTop = Math.max(0, (nowH - startH - 1) * HOUR);
  }

  function renderToday(events) {
    const now = new Date();
    const key = localDateKey(now);
    const todays = events.filter(ev => localDateKey(evStart(ev)) === key);
    const body = document.getElementById("today-body");
    if (todays.length === 0) { body.innerHTML = `<div class="empty-hint">Nothing on the calendar today.</div>`; return; }
    let nextMarked = false;
    body.innerHTML = todays.map(ev => {
      const s = evStart(ev), e = evEnd(ev);
      const allDay = !ev.start.dateTime;
      let cls = "";
      if (!allDay && e && e < now) cls = "past";
      else if (!allDay && !nextMarked && s >= now) { cls = "next"; nextMarked = true; }
      return `<div class="today-event ${cls}"><span class="t">${allDay ? "All day" : fmtTime(s)}</span><span class="n">${esc(ev.summary || "(untitled)")}</span></div>`;
    }).join("");
  }

  function renderWeek(events, days) {
    const todayKey = localDateKey(new Date());
    const byDay = {};
    days.forEach(d => byDay[localDateKey(d)] = []);
    events.forEach(ev => { const k = localDateKey(evStart(ev)); if (byDay[k]) byDay[k].push(ev); });
    const head = days.map(d => `<th class="${localDateKey(d) === todayKey ? "today-col" : ""}">${d.toLocaleDateString("en-US", { weekday: "short" })} ${d.getDate()}</th>`).join("");
    const cells = days.map(d => {
      const k = localDateKey(d);
      const list = byDay[k];
      const inner = list.length === 0 ? `<span class="wk-empty">—</span>` : list.map(ev =>
        `<div class="wk-ev"><span class="t">${ev.start.dateTime ? fmtTime(evStart(ev), true) : "All day"}</span><span class="n">${esc(ev.summary || "(untitled)")}</span></div>`
      ).join("");
      return `<td class="${k === todayKey ? "today-col" : ""}">${inner}</td>`;
    }).join("");
    document.getElementById("week-body").innerHTML = `<table class="week-table"><thead><tr>${head}</tr></thead><tbody><tr>${cells}</tr></tbody></table>`;
  }

  window.openEventModal = function () {
    if (!connected()) return;
    const now = new Date();
    const next = new Date(now.getTime() + 60 * 60 * 1000); next.setMinutes(0);
    document.getElementById("event-title").value = "";
    document.getElementById("event-date").value = localDateKey(now);
    document.getElementById("event-time").value = `${String(next.getHours()).padStart(2, "0")}:00`;
    document.getElementById("event-modal").classList.add("open");
  };

  window.submitCalendarEvent = async function () {
    const title = document.getElementById("event-title").value.trim();
    const date = document.getElementById("event-date").value;
    const time = document.getElementById("event-time").value;
    if (!title || !date || !time) return;
    const start = new Date(`${date}T${time}`);
    const end = new Date(start.getTime() + 60 * 60 * 1000);
    try {
      await gfetch("https://www.googleapis.com/calendar/v3/calendars/primary/events", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ summary: title, start: { dateTime: start.toISOString() }, end: { dateTime: end.toISOString() } }),
      });
      closeModal("event-modal");
      loadCalendar();
    } catch (e) { console.warn("Could not create event:", e); }
  };

  // ---------- tasks + reminders (Google Tasks) ----------
  // Completed items are hidden here; they stay marked done in Google Tasks.
  const TASK_LISTS = { tasks: "Home Hub — Tasks", reminders: "Home Hub — Reminders" };
  let listIds = {};

  async function ensureTaskLists() {
    if (Object.keys(listIds).length === Object.keys(TASK_LISTS).length) return;
    const res = await gfetch("https://tasks.googleapis.com/tasks/v1/users/@me/lists?maxResults=100");
    const existing = (await res.json()).items || [];
    for (const [key, title] of Object.entries(TASK_LISTS)) {
      let match = existing.find(l => l.title === title);
      if (!match) {
        const c = await gfetch("https://tasks.googleapis.com/tasks/v1/users/@me/lists", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title }),
        });
        match = await c.json();
      }
      listIds[key] = match.id;
    }
  }

  async function fetchOpenTasks(key) {
    const res = await gfetch(`https://tasks.googleapis.com/tasks/v1/lists/${listIds[key]}/tasks?showCompleted=false&showHidden=false&maxResults=100`);
    const items = (await res.json()).items || [];
    return items
      .filter(t => t.status !== "completed" && (t.title || "").trim())
      .sort((a, b) => (a.position || "").localeCompare(b.position || ""));
  }

  async function renderList(key) {
    const items = await fetchOpenTasks(key);
    const body = document.getElementById(`${key}-body`);
    body.innerHTML = items.length === 0
      ? `<div class="empty-hint">All clear.</div>`
      : `<ul class="plain">${items.map(t => `<li onclick="completeItem(this,'${key}','${t.id}')"><span class="check"></span><span>${esc(t.title)}</span></li>`).join("")}</ul>`;
    document.getElementById(`${key}-count`).textContent = `${items.length} open`;
  }

  async function renderLists() {
    await ensureTaskLists();
    await Promise.all(Object.keys(TASK_LISTS).map(renderList));
  }

  window.completeItem = async function (li, key, id) {
    if (li.classList.contains("leaving")) return;
    li.classList.add("leaving");
    try {
      await gfetch(`https://tasks.googleapis.com/tasks/v1/lists/${listIds[key]}/tasks/${id}`, {
        method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status: "completed" }),
      });
    } catch (e) { li.classList.remove("leaving"); return; }
    setTimeout(() => renderList(key), 300);
  };

  window.addListItem = async function (key) {
    const input = document.getElementById(`${key}-add-input`);
    const text = input.value.trim();
    if (!text || !connected()) return;
    input.value = "";
    try {
      await ensureTaskLists();
      await gfetch(`https://tasks.googleapis.com/tasks/v1/lists/${listIds[key]}/tasks`, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title: text }),
      });
      renderList(key);
    } catch (e) { input.value = text; }
  };

  // ---------- start ----------
  restoreToken();
  setStatus();
  renderCalView();
  document.getElementById("week-body").innerHTML = `<div class="empty-hint">Connect Google to see the week.</div>`;
  ["tasks", "reminders"].forEach(k => document.getElementById(`${k}-body`).innerHTML = `<div class="empty-hint">Connect Google to load this list.</div>`);
  window.addEventListener("load", () => {
    initGoogleAuth();
    if (connected()) { scheduleSilentRefresh(); refreshAll(); }
  });
</script>

</body>
</html>
